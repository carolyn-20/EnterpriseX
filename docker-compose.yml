services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enterprisex}
      POSTGRES_USER: ${POSTGRES_USER:-erp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_demo_password_change_me}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [erp]
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [erp]
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-erp_user}:${POSTGRES_PASSWORD:-local_demo_password_change_me}@db:5432/${POSTGRES_DB:-enterprisex}
      JWT_SECRET: ${JWT_SECRET:-local_only_replace_with_a_long_random_secret}
      PORT: 4000
      REDIS_URL: redis://redis:6379
    ports: ["4000:4000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [erp]
  reports:
    build: ./services/reports
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-erp_user}:${POSTGRES_PASSWORD:-local_demo_password_change_me}@db:5432/${POSTGRES_DB:-enterprisex}
      PORT: 8000
    depends_on:
      db: {condition: service_healthy}
    ports: ["8000:8000"]
    networks: [erp]
  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports: ["3000:3000"]
    depends_on: [api, reports]
    networks: [erp]
volumes: {pgdata: {}}
networks: {erp: {}}

services:
  - type: web
    name: enterprisex-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: enterprisex-reports
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./services/reports/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false

  - type: web
    name: enterprisex-web
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: ./apps/web
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://enterprisex-api-8zm6.onrender.com
      - key: NEXT_PUBLIC_REPORTS_URL
        value: https://enterprisex-reports.onrender.com
